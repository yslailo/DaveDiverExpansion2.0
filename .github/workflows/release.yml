name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/DaveDiverExpansion/DaveDiverExpansion.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          # Strip the leading "v" so the artifact is e.g. DaveDiverExpansion-2.0.1.zip
          $version = "${{ github.ref_name }}".TrimStart('v')
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
          $dir = "package/BepInEx/plugins/dave-diver-expansion2.0"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item "src/DaveDiverExpansion/bin/Release/net480/dave-diver-expansion2.0.dll" $dir
          Compress-Archive -Path "package/*" -DestinationPath "DaveDiverExpansion-$version.zip"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DaveDiverExpansion-*.zip
          name: DaveDiverExpansion-${{ env.VERSION }}
          generate_release_notes: true

      - name: Upload to NexusMods
        if: vars.NEXUSMODS_FILE_ID != ''
        uses: Nexus-Mods/upload-action@4593698bcd21dccdbdaf7858bdf0cb368c55e702
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          game_domain_name: davethediver
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: DaveDiverExpansion-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          fileCategory: main
